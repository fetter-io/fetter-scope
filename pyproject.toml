[project]
name = "fetter-scope"
version = "0.1.0"
description = "A terminal view and email digest of what fetter monitor-diff finds changing on a system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "textual>=0.80",
    "python-dotenv>=1.0",
]

[project.scripts]
fetter-scope = "fetter_scope.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fetter_scope"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
